# PokerTH Arena on its own. Put the master key (super admin) in .env:
#   ARENA_ADMIN_TOKEN=<a long random secret>
# Behind a reverse proxy (Caddy, nginx…) with HTTPS, set ARENA_TRUST_PROXY=1
# and ARENA_PUBLIC_URL, and publish the port on 127.0.0.1 only.
services:
  arena:
    build: .
    image: pokerth-arena
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      ARENA_ADMIN_TOKEN: ${ARENA_ADMIN_TOKEN:?set ARENA_ADMIN_TOKEN in .env}
      ARENA_TRUST_PROXY: ${ARENA_TRUST_PROXY:-0}
      ARENA_PUBLIC_URL: ${ARENA_PUBLIC_URL:-}
    volumes:
      - arena-data:/data
volumes:
  arena-data:
