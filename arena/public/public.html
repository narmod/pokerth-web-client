<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>Arena (beta) · PokerTH</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="manifest" href="/arena/manifest.json">
<meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ebe6da" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arena">
<script>
  // Theme before first paint (theme.mjs keeps it in step afterwards).
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('pth_td_theme') || 'auto'; } catch (e) {}
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
      var ms = document.querySelectorAll('meta[name="theme-color"]');
      for (var i = 0; i < ms.length; i++) { ms[i].setAttribute('content', t === 'light' ? '#ebe6da' : '#12161d'); ms[i].removeAttribute('media'); }
    }
  })();
</script>
<link rel="stylesheet" href="/arena/arena.css">
</head>
<body class="pub">
<header class="top"><div class="in">
  <a class="brand" href="/"><img src="/logo-chip-68.png" alt="" width="34" height="34">PokerTH <span>Arena</span></a>
  <span class="beta" data-t="beta" data-t-title="betaTitle">beta</span>
  <span class="sp"></span>
  <label class="sr" for="langSel" data-t="language">Language</label>
  <select id="langSel" class="langsel"></select>
  <button type="button" class="theme ghost" id="themeBtn">Theme: auto</button>
  <a class="theme ghost orglink" href="/arena/organize" data-t="organizer">Organizer</a>
</div></header>

<main>
<div class="hero"><div class="in">
  <div class="suits" aria-hidden="true"><i class="s"></i><i class="h"></i><i class="d"></i><i class="c"></i></div>
  <h1><img class="tdav" id="heroImg" src="/arena/avatar" alt="" width="64" height="64"><span id="heroTitle" data-t="title">Tournaments</span> <span class="beta" data-t="beta">beta</span></h1>
  <p id="heroText" data-t="intro">Free poker tournaments on the LAN servers of this site: register with your PokerTH nickname, then take your seat when the director invites you.</p>
</div></div>
<div class="in body" id="view" aria-live="polite"><p class="empty" data-t="loading">Loading…</p></div>
</main>
<footer class="in"><span data-t="footer">PokerTH tournament director · beta</span> · <a class="orgfoot" href="/arena/organize" data-t="organizer">Organizer</a></footer>
<script type="module" src="/arena/public.mjs"></script>
</body>
</html>
