name: Auto release

# Cuts a release automatically once the web deploy counter in public/sw.js has
# advanced by at least 10 since the last release on the same upstream line, or
# as soon as a new upstream line opens.
#
# Versioning scheme (see public/sw.js):
#   CACHE_VERSION = 'pokerth-v{MAJOR}.{MINOR}.{PATCH}-web.{N}'
# where MAJOR.MINOR.PATCH is the PokerTH release the client tracks and {N} is the
# web deploy counter, reset to 0 by every new upstream release. It is {N} that
# drives this workflow, not {PATCH}. A release tag equals that string without the
# 'pokerth-' prefix (cache pokerth-v2.1.7-web.124  <->  tag v2.1.7-web.124).
#
# The Docker image is built INLINE here on purpose: a tag/release created with
# the built-in GITHUB_TOKEN does not re-trigger docker-publish.yml (GitHub's
# anti-loop rule), so we publish the image from within this same workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  maybe-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          # Le tag vaut la valeur EXACTE des 3 fichiers de version, suffixe
          # inclus : 2.1.7-web.124 -> v2.1.7-web.124.
          CACHE=$(grep -E "^const CACHE_VERSION" public/sw.js | grep -oE "pokerth-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?" | head -1 || true)
          if [ -z "${CACHE}" ]; then
            echo "::warning::CACHE_VERSION not in 'pokerth-v{MAJOR}.{MINOR}.{PATCH}[-suffix]' format — skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          VER=${CACHE#pokerth-v}                 # e.g. 2.1.7-web.124
          TAG="v${VER}"
          BASE=${VER%%-*}                        # 2.1.7  (ligne upstream)
          SUFFIX=${VER#"$BASE"}                  # -web.124 (vide si absent)
          echo "Cache version: ${VER}  (candidate tag ${TAG})"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Le compteur qui declenche est N (apres -web.), jamais le PATCH
          # upstream : celui-ci ne bouge qu'une fois par release PokerTH.
          case "${SUFFIX}" in
            -web.*) N=${SUFFIX#-web.} ;;
            *)
              echo "::warning::version '${VER}' carries no -web.{N} counter — skipping."
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! echo "${N}" | grep -qE '^[0-9]+$'; then
            echo "::warning::web counter '${N}' is not a plain number — skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Plus grand N deja publie sur CETTE ligne upstream (vide si aucun).
          LAST_N=$(git tag -l "v${BASE}-web.*" \
            | sed -E "s/^v[0-9]+\.[0-9]+\.[0-9]+-web\.([0-9]+).*/\1/" \
            | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          echo "Last released N on the ${BASE} line: ${LAST_N:-none}"

          if [ -z "${LAST_N}" ]; then
            echo "New upstream line ${BASE} — releasing ${TAG}."
            RELEASE=true
          elif [ $(( N - LAST_N )) -ge 10 ]; then
            echo "Threshold reached (${N} - ${LAST_N} >= 10) — releasing ${TAG}."
            RELEASE=true
          else
            echo "Threshold not reached (${N} - ${LAST_N} < 10) — skipping."
            RELEASE=false
          fi

          if [ "${RELEASE}" = true ]; then
            {
              echo "release=true"
              echo "tag=${TAG}"
              echo "ver=${VER}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and GitHub release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.decide.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.decide.outputs.tag }}" \
            --generate-notes

      - name: Set up QEMU
        if: steps.decide.outputs.release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decide.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.decide.outputs.release == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.decide.outputs.ver }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.decide.outputs.tag }}

      - name: Build and push image
        if: steps.decide.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
