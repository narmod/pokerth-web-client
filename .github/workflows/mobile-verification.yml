name: Mobile verification

# Runs scripts/test-mobile-browser.mjs (npm run test:mobile) in real browser
# engines: WebKit with iPhone profiles (the closest CI gets to iOS Safari) and
# Chromium with Pixel / Galaxy profiles (Android Chrome). See
# docs/MOBILE_VERIFICATION.md for what is checked and what still needs a real
# phone.
#
# Informational: this workflow releases nothing and blocks nothing - a red run
# means "look at the mobile table before deploying". The step screenshots are
# kept as an artifact (mobile-screenshots) for 14 days, on success and failure.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/test-mobile-browser.mjs'
      - 'scripts/test-table-sweep.mjs'
      - 'scripts/test-showdown-browser.mjs'
      - 'scripts/test-i18n-overflow.mjs'
      - 'scripts/test-pwa-browser.mjs'
      - 'scripts/test-reconnect-browser.mjs'
      - 'scripts/test-notices-browser.mjs'
      - 'scripts/lib/mobile-harness.mjs'
      - '.github/workflows/mobile-verification.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/test-mobile-browser.mjs'
      - 'scripts/test-table-sweep.mjs'
      - 'scripts/lib/mobile-harness.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The test needs Playwright only (the client is served as static files by
      # the script itself): install the exact version pinned in package.json
      # instead of the whole dependency tree.
      - name: Install Playwright (pinned version)
        run: |
          PW="$(node -p "require('./package.json').devDependencies.playwright")"
          npm install --no-save --no-package-lock "playwright@${PW}"
          npx playwright install --with-deps chromium webkit

      - name: Mobile verification (iOS WebKit + Android Chromium)
        run: npm run test:mobile

      - name: End of hand (showdown, all-in, side pot, next hand)
        if: always()
        run: npm run test:showdown-browser

      - name: PWA (service worker, offline boot, update banner, manifest)
        if: always()
        run: npm run test:pwa-browser

      - name: Connection loss (reconnect notice, back-off, give-up window)
        if: always()
        run: npm run test:reconnect-browser

      - name: Operator notices (broadcasts, restart notice, notice windows)
        if: always()
        run: npm run test:notices-browser

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-screenshots
          path: test-artifacts/mobile/
          if-no-files-found: ignore
          retention-days: 14

  # Every table size (2-10 players), seated and spectator, portrait and
  # landscape: 90 configurations, about 15 minutes. Runs beside the job above.
  table-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (pinned version)
        run: |
          PW="$(node -p "require('./package.json').devDependencies.playwright")"
          npm install --no-save --no-package-lock "playwright@${PW}"
          npx playwright install --with-deps chromium webkit

      - name: Table sweep (2-10 players, seated + spectator)
        run: npm run test:table-sweep

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: table-sweep-screenshots
          path: test-artifacts/mobile/
          if-no-files-found: ignore
          retention-days: 14

  # Every interface language on narrow phones: clipped labels, text running out
  # of buttons, overlaps. About 4 minutes per phone.
  i18n-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (pinned version)
        run: |
          PW="$(node -p "require('./package.json').devDependencies.playwright")"
          npm install --no-save --no-package-lock "playwright@${PW}"
          npx playwright install --with-deps chromium webkit

      - name: Text overflow in every language
        run: npm run test:i18n-overflow

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-overflow-screenshots
          path: test-artifacts/mobile/
          if-no-files-found: ignore
          retention-days: 14
